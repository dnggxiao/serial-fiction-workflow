name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Prepare clean test tree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/repo-under-test"
          rsync -a --delete --exclude='.git/' ./ "$RUNNER_TEMP/repo-under-test/"

      - name: Run tests
        working-directory: ${{ runner.temp }}/repo-under-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider

      - name: Check generated files are absent
        working-directory: ${{ runner.temp }}/repo-under-test
        shell: bash
        run: |
          if find . -type d \( -name __pycache__ -o -name .pytest_cache \) -print -quit | grep -q .; then
            echo "Generated cache directory found"
            exit 1
          fi
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Compiled Python file found"
            exit 1
          fi

      - name: Check current version
        working-directory: ${{ runner.temp }}/repo-under-test
        shell: bash
        run: test "$(cat VERSION)" = "1.6.0"
